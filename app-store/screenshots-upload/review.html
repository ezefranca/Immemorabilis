<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immemorabilis App Store screenshots</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 32px; background: #10161d; color: #f5f7fa; }
    h1, h2 { margin: 0 0 20px; }
    h2 { margin-top: 48px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 24px; align-items: start; }
    figure { margin: 0; }
    img { width: 100%; height: auto; display: block; border-radius: 18px; box-shadow: 0 14px 38px rgba(0, 0, 0, .35); }
    figcaption { margin-top: 10px; color: #b8c2cc; font-size: 13px; }
    .ipad { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
  </style>
</head>
<body>
  <h1>Immemorabilis 1.0</h1>
  <h2>iPhone 6.5-inch</h2>
  <section class="grid">
    <figure><img src="en-US/iphone-65/01-persistent-reminders.png"><figcaption>1. Persistent reminders</figcaption></figure>
    <figure><img src="en-US/iphone-65/02-quick-capture.png"><figcaption>2. Quick capture</figcaption></figure>
    <figure><img src="en-US/iphone-65/03-notes-and-links.png"><figcaption>3. Notes and links</figcaption></figure>
    <figure><img src="en-US/iphone-65/04-location-reminders.png"><figcaption>4. Location reminders</figcaption></figure>
    <figure><img src="en-US/iphone-65/05-repeat-rules.png"><figcaption>5. Repeat rules</figcaption></figure>
    <figure><img src="en-US/iphone-65/06-settings.png"><figcaption>6. Settings</figcaption></figure>
    <figure><img src="en-US/iphone-65/07-dark-mode.png"><figcaption>7. Dark mode</figcaption></figure>
  </section>
  <h2>iPad 12.9-inch</h2>
  <section class="grid ipad">
    <figure><img src="en-US/ipad-129/01-persistent-reminders.png"><figcaption>1. Persistent reminders</figcaption></figure>
    <figure><img src="en-US/ipad-129/02-quick-capture.png"><figcaption>2. Quick capture</figcaption></figure>
    <figure><img src="en-US/ipad-129/03-notes-and-links.png"><figcaption>3. Notes and links</figcaption></figure>
    <figure><img src="en-US/ipad-129/04-location-reminders.png"><figcaption>4. Location reminders</figcaption></figure>
    <figure><img src="en-US/ipad-129/05-repeat-rules.png"><figcaption>5. Repeat rules</figcaption></figure>
    <figure><img src="en-US/ipad-129/06-settings.png"><figcaption>6. Settings</figcaption></figure>
    <figure><img src="en-US/ipad-129/07-dark-mode.png"><figcaption>7. Dark mode</figcaption></figure>
  </section>
</body>
</html>
